<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE ARCHITECT OF FATE - Final Edition</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <style>
        :root {
            --bg-color: #121212;
            --device-bg: #050505;
            --accent-color: #c5a059;
            --text-color: #e0e0e0;
            --danger-color: #ff3b30;
            --muted-text: #666;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: "Hiragino Mincho ProN", "MS Mincho", serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .phone-frame {
            width: 380px;
            height: 780px;
            background: #000;
            border: 8px solid #1a1a1a;
            border-radius: 45px;
            box-shadow: 0 50px 100px rgba(0,0,0,0.9);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        #app-viewport {
            flex: 1;
            background-color: var(--device-bg);
            padding: 70px 25px 40px;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .screen { display: none; flex-direction: column; height: 100%; opacity: 0; transition: opacity 0.8s ease; }
        .screen.active { display: flex; opacity: 1; }

        h1 { font-size: 1.8rem; color: var(--accent-color); letter-spacing: 0.3em; text-align: center; margin-bottom: 20px; }
        .main-content { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .desc-text { font-size: 0.75rem; color: var(--muted-text); line-height: 2.2; text-align: center; margin-bottom: 40px; }
        
        button { background: transparent; border: 1px solid var(--accent-color); color: var(--accent-color); padding: 20px; font-size: 0.9rem; letter-spacing: 0.3em; cursor: pointer; width: 100%; transition: 0.4s; }
        button:hover { background: var(--accent-color); color: #000; box-shadow: 0 0 15px var(--accent-color); }

        .select-row { display: flex; gap: 8px; width: 100%; margin-bottom: 20px; }
        select { flex: 1; background: rgba(255,255,255,0.03); border: 1px solid #222; color: #fff; padding: 12px 5px; outline: none; appearance: none; text-align: center; }

        .result-card { border-left: 2px solid var(--accent-color); padding-left: 20px; margin: 20px 0 30px; width: 100%; }
        .star-name { font-size: 2.2rem; color: #fff; }
        .badge { color: var(--accent-color); border: 1px solid var(--accent-color); display: inline-block; padding: 2px 8px; font-size: 0.7rem; margin-bottom: 10px; }
        
        #hell-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, #700, #100); color: #fff;
            display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 100; padding: 40px; text-align: center;
        }
    </style>
</head>
<body>

<div class="phone-frame">
    <div id="hell-overlay">
        <h2 style="font-size: 2.8rem; margin-bottom: 30px;">地獄に<br>落ちるわよ！</h2>
        <button onclick="closeHell()" style="color:#fff; border-color:#fff;">…はい。</button>
    </div>

    <div id="app-viewport">
        <div id="scr-home" class="screen active">
            <h1>運命の設計図</h1>
            <div class="main-content">
                <p class="desc-text">孤独を資産に変えるための<br>「設計」だけを、ここに記す。</p>
                <p style="font-size: 0.85rem; color: #444; text-align: center; line-height: 1.8; margin-bottom: 50px;">あんたの「冬」が、<br>そこまで来ているよ。</p>
                <button onclick="initApp()">扉を叩く</button>
            </div>
        </div>

        <div id="scr-input" class="screen">
            <h1>設計の入力</h1>
            <div class="main-content">
                <div class="select-row">
                    <select id="year"></select><select id="month"></select><select id="day"></select>
                </div>
            </div>
            <button onclick="calculate()">設計を執行する</button>
        </div>

        <div id="scr-result" class="screen">
            <div class="main-content" style="justify-content: flex-start; padding-top: 40px;">
                <div class="result-card">
                    <div class="star-name" id="out-star">--星人</div>
                    <div class="badge" id="out-pol">--</div>
                    <div style="font-style: italic; color: #bbb;" id="out-msg">...</div>
                </div>
                <div id="cycle-info" style="background: rgba(255,255,255,0.03); padding: 20px; width: 100%; text-align: center;">
                    <div id="cycle-label" style="font-size: 1.4rem; color: var(--accent-color);">--</div>
                </div>
                <button id="danger-btn" style="display:none; border-color:var(--danger-color); color:var(--danger-color); margin-top: 30px;" onclick="showHell()">
                    禁断の警告を確認する
                </button>
            </div>
            <button onclick="location.reload()" style="border-color: #222; color: #444; margin-top: 10px;">沈黙へ戻る</button>
        </div>
    </div>
</div>

<script>
    // --- 音声実装：耳コピMIDI解析データに基づく ---
    const reverb = new Tone.Reverb({ decay: 5, wet: 0.5 }).toDestination();
    const piano = new Tone.Sampler({
        urls: { "C4": "https://tonejs.github.io/audio/salamander/C4.mp3" },
        release: 1.2
    }).connect(reverb);

    // 解析されたメロディ (ド、シド、ラ、ミ、ラ、ド)
const melody = [
        // 1小節目：B4始まりの下降フレーズ
        { time: "0:0:0", note: "B4", dur: "2n", vel: 0.6 },
        { time: "0:2:0", note: "G4", dur: "8n", vel: 0.45 },
        { time: "0:2:2", note: "G4", dur: "16n", vel: 0.35 },
        { time: "0:3:0", note: "A4", dur: "4n", vel: 0.5 },

        // 2小節目：ミ・ラ・ドの展開
        { time: "1:0:0", note: "E4", dur: "2n", vel: 0.6 },
        { time: "1:2:0", note: "A3", dur: "8n", vel: 0.4 },
        { time: "1:3:0", note: "C4", dur: "2n", vel: 0.55 },
        
        // 和音の厚みを出すための低域（MIDIデータの伴奏要素）
        { time: "0:0:0", note: "E2", dur: "1m", vel: 0.2 },
        { time: "1:0:0", note: "A2", dur: "1m", vel: 0.2 }
    ];

    const part = new Tone.Part((time, value) => {
        piano.triggerAttackRelease(value.note, value.dur, time);
    }, melody);
    part.loop = true;
    part.loopEnd = "2:0:0";

    async function initApp() {
        await Tone.start(); // ユーザー操作によるAudioContext開始
        Tone.Transport.bpm.value = 75;
        Tone.Transport.start();
        part.start(0);
        nav('scr-input');
    }

    // --- ロジック実装：大殺界算出 ---
    const yS = document.getElementById('year'), mS = document.getElementById('month'), dS = document.getElementById('day');
    for(let i=1940; i<=2026; i++) yS.add(new Option(`${i}年`, i));
    for(let i=1; i<=12; i++) mS.add(new Option(`${i}月`, i));
    for(let i=1; i<=31; i++) dS.add(new Option(`${i}日`, i));
    yS.value = 1990;

    function nav(id) {
        document.querySelectorAll('.screen').forEach(s => { s.classList.remove('active'); s.style.display = 'none'; });
        const t = document.getElementById(id);
        t.style.display = 'flex';
        setTimeout(() => t.classList.add('active'), 50);
    }

    function calculate() {
        const y = parseInt(yS.value), m = parseInt(mS.value), d = parseInt(dS.value);
        const stars = ["土星人", "金星人", "火星人", "天王星人", "木星人", "水星人"];
        const cycles = ["種子", "緑生", "立花", "健弱", "達成", "乱気", "再会", "財成", "安定", "陰影", "停止", "減退"];
        
        // 簡易運命周期判定
        const hash = y + m + d;
        const starIdx = hash % 6;
        const thisYear = new Date().getFullYear();
        const curCycleIdx = (thisYear - y + 12) % 12;

        document.getElementById('out-star').innerText = stars[starIdx];
        document.getElementById('out-pol').innerText = (y % 2 === 0) ? "陽 (+)" : "陰 (-)";
        document.getElementById('cycle-label').innerText = `現在の運命周期：${cycles[curCycleIdx]}`;
        
        // 大殺界判定（9:陰影, 10:停止, 11:減退）
        const isDaisakkai = curCycleIdx >= 9;
        document.getElementById('danger-btn').style.display = isDaisakkai ? 'block' : 'none';
        document.getElementById('out-msg').innerText = isDaisakkai ? 
            "あんた、今まさに『大殺界』の闇の中にいるよ。動けば動くほど泥沼だよ。" : 
            "孤独を資産に変えなさい。今はまだ、嵐の前の静けさだ。";

        nav('scr-result');
    }

    function showHell() { document.getElementById('hell-overlay').style.display = 'flex'; }
    function closeHell() { document.getElementById('hell-overlay').style.display = 'none'; }

    // サービスワーカー（sw.js）をブラウザに登録する
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
            .then(reg => console.log('Service Worker registered!'))
            .catch(err => console.error('Service Worker failed:', err));
        });
    }
</script>
</body>
</html>
